<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b3d6e">
<title>Consulta de Ponto · SGM/TAQ</title>
<style>
:root{--azul:#0b3d6e;--azul2:#1665a8;--bg:#f2f5fa;--card:#fff;--txt:#1f2937;--sub:#6b7280;--bord:#e5e9f0;
--pos:#059669;--neg:#dc2626;--posbg:#d1fae5;--negbg:#fee2e2;--warn:#c2410c;--warnbg:#ffedd5;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--txt)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
background:radial-gradient(circle at 20% 10%,#2b7cc4 0,transparent 45%),linear-gradient(160deg,#0b3d6e,#082a4d)}
.lbox{background:#fff;border-radius:22px;padding:30px 26px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--azul),var(--azul2));display:grid;place-items:center;margin-bottom:14px}
.lbox h1{margin:0 0 4px;font-size:22px}.lbox p{margin:0 0 22px;color:var(--sub);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:#374151}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--bord);border-radius:12px;font-size:16px;background:#fff;color:var(--txt)}
input:focus,select:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(22,101,168,.15)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);padding:6px}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.6}
.erro{color:var(--neg);font-size:13.5px;margin-top:12px;min-height:18px}
.nota{font-size:12px;color:var(--sub);margin-top:18px;text-align:center}
header.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;
padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 2px 10px rgba(0,0,0,.15)}
.toprow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.toprow .t{flex:1;min-width:0}.toprow b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow small{opacity:.85;font-size:12px}
.sair{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}
.tabs{max-width:1100px;margin:10px auto 0;display:flex;gap:6px}
.tab{flex:1;border:0;border-radius:10px;padding:9px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px}
.tab.on{background:#fff;color:var(--azul)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;color:var(--azul);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;color:var(--sub);font-size:12px}
.pessoa{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:var(--azul);display:grid;place-items:center;font-weight:800;flex:none}
.pessoa b{font-size:16px}.pessoa div div{color:var(--sub);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.kpi small{display:block;color:var(--sub);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi b{display:block;font-size:26px;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--sub)}
.kpi.dest{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff}.kpi.dest small,.kpi.dest span{color:rgba(255,255,255,.8)}
.kpi.dest b{color:#fff}
.nav{display:flex;align-items:center;gap:8px}
.nav button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--bord);background:#fff;font-size:18px;color:var(--azul)}
.nav button:disabled{opacity:.35}
.nav .lab{flex:1;text-align:center;font-weight:700}
.nav .lab small{display:block;font-weight:500;color:var(--sub);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef2f7;color:#374151;font-weight:600}
.chip.w{background:var(--warnbg);color:var(--warn)}.chip.p{background:var(--posbg);color:var(--pos)}.chip.n{background:var(--negbg);color:var(--neg)}
/* ---------- folha mensal ---------- */
.folha{overflow-x:auto;margin:14px -4px 0;-webkit-overflow-scrolling:touch}
.folha table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:300px}
.folha th{position:sticky;top:0;background:#eef2f7;color:#374151;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
  font-weight:700;padding:8px 6px;text-align:center;border-bottom:1px solid var(--bord)}
.folha th:first-child{text-align:left;border-radius:8px 0 0 0}.folha th:last-child{border-radius:0 8px 0 0}
.folha td{padding:7px 6px;border-bottom:1px solid #f1f3f6;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.folha td.d{text-align:left;font-weight:700}.folha td.d span{font-weight:600;color:var(--sub);font-size:11.5px;text-transform:uppercase;margin-left:4px}
.folha td.r{text-align:right}
.folha td.cod{color:#475569;font-weight:600;font-size:12.5px;letter-spacing:.02em}
.folha tr.fds td{background:#fafbfc;color:#9ca3af}
.folha tr.fds td.d span{color:#cbd5e1}
.folha tr.fim td{border-bottom:2px solid #dbe3ee}
.folha tr.vazio td{color:#cbd5e1}
.folha tr.hoje td{background:#eff6ff}
.folha tr.prev td{background:repeating-linear-gradient(135deg,#f8fafc 0 8px,#f1f5f9 8px 16px);color:#475569;font-style:italic}
.folha tr.al td{background:#fff7ed}
.folha tr.nota td{padding:0 6px 7px;text-align:left;font-size:12px;border-bottom:1px solid #f1f3f6}
.folha tr.nota.al td{background:#fff7ed;color:var(--warn);font-weight:600}
.folha tr.nota.pv td{background:#f8fafc;color:#64748b}
.folha .pre{color:#94a3b8}
.folha tfoot td{font-weight:800;background:#eef2f7;border-bottom:0;padding:9px 6px}
.folha tfoot td:first-child{border-radius:0 0 0 8px}.folha tfoot td:last-child{border-radius:0 0 8px 0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#eef2f7}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.g{background:#e2e8f0;color:#475569}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
svg text{font-family:inherit}
.tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;z-index:50;transform:translate(-50%,-115%);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--sub);font-weight:600;padding:8px;border-bottom:1px solid var(--bord)}
td{padding:9px 8px;border-bottom:1px solid #f1f3f6;font-variant-numeric:tabular-nums}
.r{text-align:right}
.resumo tr{cursor:pointer}.resumo tr.sel td{background:#eff6ff;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:160px;padding:10px 12px;font-size:15px}
.tools select{width:auto;padding:10px 12px;font-size:14px}
.sbtn{border:1.5px solid var(--bord);background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--azul)}
.equipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mem{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);border:1.5px solid transparent;text-align:left;width:100%;transition:.15s}
.mem:hover{border-color:#bfdbfe;transform:translateY(-1px)}
.mem.alto{border-color:#fca5a5}
.mem .h{display:flex;gap:10px;align-items:center;margin-bottom:10px}.mem .h b{font-size:14.5px;display:block}
.mem .h span{font-size:12px;color:var(--sub)}
.mem .n{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mem .n div small{display:block;font-size:11px;color:var(--sub)}.mem .n div b{font-size:16px;font-variant-numeric:tabular-nums}
.lista li{padding:8px 0;border-bottom:1px solid #f1f3f6;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lista li:last-child{border-bottom:0}
.lista{margin:0;padding:0}
.leg{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.selcol{margin-bottom:14px}
.hoje{background:linear-gradient(160deg,#fff,#f5f9ff);border:1.5px solid #dbeafe}
.hoje .lin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hoje label{margin:0 0 5px}
.campo{display:flex;gap:6px}.campo input{text-align:center;letter-spacing:.04em;font-weight:600;padding:11px 10px;font-size:17px;font-variant-numeric:tabular-nums}
.agora{border:0;border-radius:12px;background:var(--azul2);color:#fff;font-weight:700;font-size:13px;padding:0 12px;white-space:nowrap}
.prevbox{margin-top:14px;border-radius:14px;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prevbox small{display:block;opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.prevbox b{font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prevbox .cd{text-align:right;font-size:14px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini div{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:9px 10px}
.mini small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.mini b{font-size:16px;font-variant-numeric:tabular-nums}
.lnk{border:0;background:none;color:var(--azul2);font-weight:600;padding:4px 0;font-size:13px}
.lnk.del{color:var(--neg)}
.alerta-chefe{border-left:4px solid var(--neg)}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.kpi b{font-size:22px}}
@media(max-width:430px){.folha table{font-size:12.5px}.folha td,.folha th{padding-left:3px;padding-right:3px}.folha .ctrab{display:none}}
@media(max-width:380px){.kpi b{font-size:20px}.prevbox b{font-size:28px}.mini b{font-size:14px}}
@media print{header.top,.hoje,.nav button,.selcol,.grid2,.kpis{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="flogin" autocomplete="on">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h1>Consulta de Ponto · SGM/TAQ</h1>
    <p>Entre com o login e a senha que você recebeu.</p>
    <label for="u">Login</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" inputmode="text" required>
    <label for="s">Senha</label>
    <div class="pw"><input id="s" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="ver" aria-label="Mostrar senha">👁</button></div>
    <button class="btn" id="entrar">Entrar</button>
    <div class="erro" id="erro"></div>
    <div class="nota">🔒 Seus dados são descriptografados apenas neste aparelho.</div>
  </form>
</section>

<section id="app" class="hide">
  <header class="top">
    <div class="toprow">
      <div class="t"><b id="hNome"></b><small id="hAtu"></small></div>
      <button class="sair" id="sair">Sair</button>
    </div>
    <div class="tabs hide" id="tabs">
      <button class="tab on" data-v="equipe">Equipe</button>
      <button class="tab" data-v="ind">Individual</button>
    </div>
  </header>
  <main>
    <div id="vEquipe" class="hide"></div>
    <div id="vInd" class="hide"></div>
  </main>
</section>
<div class="tip hide" id="tip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const DS = ["dom","seg","ter","qua","qui","sex","sáb"];
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESX = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const fmt = (m, sinal = true) => {
  if (m === null || m === undefined) return "—";
  const s = m < 0 ? "-" : (sinal ? "+" : ""); m = Math.abs(Math.round(m));
  return s + String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
};
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const toMin = t => { const [h, m] = t.slice(0, 5).split(":").map(Number); return h * 60 + m; };
const cls = m => (m || 0) > 0 ? "pos" : (m || 0) < 0 ? "neg" : "neu";
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dParse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dIso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dBr = (d, ano) => String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + (ano ? "/" + d.getFullYear() : "");
const segunda = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hojeIso = () => dIso(new Date());
const agoraMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const nomeBonito = n => n.toLowerCase().split(" ").map(p => ["de","da","do","das","dos","e"].includes(p) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
const iniciais = n => { const p = n.split(" ").filter(x => x.length > 2); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
const TIPO = {feriado:"Feriado", folga_banco:"Folga (banco)", ferias:"Férias/afast.", sem_registro:"Sem registro", incompleto:"Incompleto"};
const jorTxt = j => (j.min % 60 ? fmt(j.min, false) : (j.min / 60) + "h") + (j.int ? ` + ${j.int} min de intervalo` : " direto");
const HORA_OK = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v);

/* regra da CCT: dentro da tolerância = 0; hora a mais × fator; hora a menos × 1 */
function saldoRegra(trab, j, fator) {
  const dif = trab - j.min;
  if (Math.abs(dif) <= j.tol) return 0;
  return dif > 0 ? dif * fator : dif;
}

/* criptografia */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sha256hex(t) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}
let CHAVE_LOCAL = "";
async function entrar(login, senha) {
  const nome = (await sha256hex("ponto|" + login.trim().toLowerCase())).slice(0, 40);
  const r = await fetch("dados/" + nome + ".json", {cache: "no-store"});
  if (!r.ok) throw new Error("login");
  const pac = await r.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(pac.sal), iterations: pac.it, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  try {
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(pac.iv)}, chave, b64(pac.dados));
    CHAVE_LOCAL = "pontoAnot:" + nome;
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { throw new Error("senha"); }
}

/* anotações (só neste aparelho) */
const lerAnot = () => { try { return JSON.parse(localStorage.getItem(CHAVE_LOCAL) || "{}"); } catch (e) { return {}; } };
const gravarAnot = a => localStorage.setItem(CHAVE_LOCAL, JSON.stringify(a));
function calcAnot(a, j, fator) {
  if (!a || !a.e || !a.s) return null;
  let trab = toMin(a.s) - toMin(a.e); if (trab < 0) trab += 1440;
  trab -= j.int;
  return {trab, saldo: saldoRegra(trab, j, fator)};
}

/* modelo de dados */
function preparar(c, comAnot) {
  if (!c.oficiais) c.oficiais = c.dias.map(d => ({...d, dt: dParse(d.d)}));
  const fator = (DADOS.regras && DADOS.regras.fator) || 2;
  const ofi = new Map(c.oficiais.map(d => [d.d, d]));
  const ultOfi = [...c.oficiais].reverse().find(d => d.bh !== null);
  let dias = c.oficiais.map(d => ({...d}));
  c.anot = comAnot ? lerAnot() : {};
  dias.forEach(d => {
    const a = c.anot[d.d];
    const reais = d.b.filter(x => !x.endsWith("^"));
    if (a && a.e && a.s && reais.length >= 2) {
      const e0 = toMin(reais[0]), s0 = toMin(reais[reais.length - 1]);
      if (Math.abs(e0 - toMin(a.e)) > 2 || Math.abs(s0 - toMin(a.s)) > 2) d.div = `Sua anotação foi ${a.e}–${a.s}`;
    }
  });
  let banco = ultOfi ? ultOfi.bh : 0;
  const pend = Object.keys(c.anot).filter(k => !ofi.has(k) && (!ultOfi || k > ultOfi.d)).sort();
  pend.forEach(k => {
    const r = calcAnot(c.anot[k], c.j, fator); if (!r) return;
    banco += r.saldo;
    const a = c.anot[k];
    dias.push({d: k, dt: dParse(k), b: [a.e, a.s], s: r.saldo, bh: banco, t: "previsto", w: r.trab, a: "", prev: true});
  });
  dias.sort((x, y) => x.d.localeCompare(y.d));
  c.diasTodos = dias;
  c.temPrev = pend.length > 0;
  const sem = new Map();
  dias.forEach(d => { const k = dIso(segunda(d.dt)); if (!sem.has(k)) sem.set(k, []); sem.get(k).push(d); });
  c.semanas = [...sem.entries()].sort().map(([k, ds]) => {
    const ini = dParse(k);
    const bancoFim = [...ds].reverse().find(d => d.bh !== null);
    return { ini, fim: addD(ini, 6), dias: ds, temPrev: ds.some(d => d.prev),
      saldo: ds.reduce((a, d) => a + (d.s || 0), 0),
      trab: ds.reduce((a, d) => a + (d.w || 0), 0),
      ndias: ds.filter(d => ["trabalhado", "incompleto", "previsto"].includes(d.t)).length,
      banco: bancoFim ? bancoFim.bh : null,
      alertas: ds.filter(d => d.a),
      cont: t => ds.filter(d => d.t === t).length };
  });
  const mes = new Map();
  dias.forEach(d => { const k = d.d.slice(0, 7); if (!mes.has(k)) mes.set(k, []); mes.get(k).push(d); });
  c.meses = [...mes.entries()].sort().map(([k, ds]) => ({ k, ds,
    saldo: ds.reduce((a, d) => a + (d.s || 0), 0), trab: ds.reduce((a, d) => a + (d.w || 0), 0),
    ndias: ds.filter(d => ["trabalhado", "incompleto", "previsto"].includes(d.t)).length,
    banco: [...ds].reverse().find(d => d.bh !== null)?.bh ?? null,
    temPrev: ds.some(d => d.prev),
    alertas: ds.filter(d => d.a).length,
    cont: t => ds.filter(d => d.t === t).length }));
  c.bancoOficial = ultOfi ? ultOfi.bh : null;
  c.ultimoOficial = ultOfi ? ultOfi.dt : null;
  c.bancoAtual = c.temPrev ? banco : c.bancoOficial;
  c.ultimoDia = dias.length ? dias[dias.length - 1].dt : null;
  return c;
}

const ehChefe = () => !!DADOS && DADOS.perfil === "admin";
const mesDe = (c, iso) => { const i = c.meses.findIndex(m => m.k === iso.slice(0, 7)); return i < 0 ? c.meses.length - 1 : i; };

$("#ver").onclick = () => { const s = $("#s"); s.type = s.type === "password" ? "text" : "password"; };
$("#flogin").onsubmit = async ev => {

function sair() {

/* tooltip */
const tip = $("#tip");
function ligarTip(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    const on = e => { const p = e.touches ? e.touches[0] : e; tip.innerHTML = el.dataset.tip;
      tip.style.left = p.clientX + "px"; tip.style.top = p.clientY + "px"; tip.classList.remove("hide"); };
    el.addEventListener("mousemove", on); el.addEventListener("touchstart", on, {passive: true});
    el.addEventListener("mouseleave", () => tip.classList.add("hide"));
    el.addEventListener("touchend", () => setTimeout(() => tip.classList.add("hide"), 1200));
  });
}

/* gráficos */
function grafDias(m) {
  const [y, mo] = m.k.split("-").map(Number), nd = new Date(y, mo, 0).getDate();
  const porDia = new Map(m.ds.map(d => [d.dt.getDate(), d]));
  const W = 640, H = 200, pad = 6, base = H / 2 + 4, top = 22;
  const max = Math.max(60, ...m.ds.map(d => Math.abs(d.s || 0)));
  const lw = (W - 2 * pad) / nd;
  let g = `<svg viewBox="0 0 ${W} ${H + 22}" width="100%"><line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" stroke="#cbd5e1"/>`;
  for (let i = 1; i <= nd; i++) {
    const d = porDia.get(i), x = pad + (i - 1) * lw + lw * .15, w = lw * .7;
    if (d && d.s) {
      const h = Math.abs(d.s) / max * (H / 2 - top), yy = d.s >= 0 ? base - h : base;
      const cor = d.s >= 0 ? "#34d399" : "#f87171";
      g += `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h, 2)}" rx="3" fill="${cor}" ${d.prev ? 'fill-opacity=".45" stroke="' + cor + '" stroke-dasharray="3 2"' : ""}
        data-tip="${dBr(d.dt)} (${DS[d.dt.getDay()]})${d.prev ? " · previsto" : ""}<br>Saldo <b>${fmt(d.s)}</b> · Banco ${fmt(d.bh)}"/>`;
    }
    if (i === 1 || i % 5 === 0) g += `<text x="${x + w / 2}" y="${H + 16}" font-size="13" text-anchor="middle" fill="#6b7280">${i}</text>`;
  }
  return g + "</svg>";
}
function grafBanco(c) {
  const P = c.diasTodos.filter(d => d.bh !== null).slice(-120);
  if (P.length < 2) return "<p class='leg'>Dados insuficientes.</p>";
  const W = 640, H = 200, pl = 8, pr = 8, pt = 22, pb = 26;
  const vals = P.map(d => d.bh), mn = Math.min(...vals), mx = Math.max(...vals), rg = Math.max(30, mx - mn);
  const X = i => pl + i * (W - pl - pr) / (P.length - 1), Y = v => pt + (1 - (v - mn) / rg) * (H - pt - pb);
  const iPrev = P.findIndex(d => d.prev);
  const nOfi = iPrev < 0 ? P.length : iPrev;
  const pts = P.slice(0, nOfi).map((d, i) => `${X(i).toFixed(1)},${Y(d.bh).toFixed(1)}`).join(" ");
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#1665a8" stop-opacity=".25"/><stop offset="1" stop-color="#1665a8" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${X(0)},${H - pb} ${pts} ${X(nOfi - 1)},${H - pb}" fill="url(#gb)"/>
    <polyline points="${pts}" fill="none" stroke="#1665a8" stroke-width="2.5" stroke-linejoin="round"/>`;
  if (iPrev >= 0) {
    const st = Math.max(iPrev - 1, 0);
    const pp = P.slice(st).map((d, k) => `${X(k + st).toFixed(1)},${Y(d.bh).toFixed(1)}`).join(" ");
    g += `<polyline points="${pp}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  }
  g += `<text x="${pl}" y="${H - 6}" font-size="14" fill="#6b7280">${dBr(P[0].dt, true)}</text>
    <text x="${W - pr}" y="${H - 6}" font-size="14" fill="#6b7280" text-anchor="end">${dBr(P[P.length - 1].dt, true)}</text>
    <text x="${W - pr}" y="${Math.max(16, Y(P[P.length - 1].bh) - 8)}" font-size="16" font-weight="700" fill="#0b3d6e" text-anchor="end">${fmt(P[P.length - 1].bh)}${iPrev >= 0 ? " (prev.)" : ""}</text>`;
  const lw = (W - pl - pr) / P.length;
  P.forEach((d, i) => g += `<rect x="${X(i) - lw / 2}" y="0" width="${lw}" height="${H}" fill="transparent"
    data-tip="${dBr(d.dt, true)} (${DS[d.dt.getDay()]})${d.prev ? " · previsto" : ""}<br>Banco <b>${fmt(d.bh)}</b> · dia ${fmt(d.s)}"/>`);
  return g + "</svg>";
}

/* folha de ponto do mês */
const COD = {feriado: "FERIADO", folga_banco: "FOLGA (BANCO)", ferias: "FÉRIAS / AFAST."};
function htmlFolha(c, m) {
  const [y, mo] = m.k.split("-").map(Number), nd = new Date(y, mo, 0).getDate();
  const porDia = new Map(m.ds.map(d => [d.dt.getDate(), d]));
  const hoje = hojeIso();
  const bat = x => x ? `<span class="${x.endsWith("^") ? "pre" : ""}">${esc(x)}</span>` : "";
  let rows = "";
  for (let i = 1; i <= nd; i++) {
    const dt = new Date(y, mo - 1, i), iso = dIso(dt), d = porDia.get(i), wd = dt.getDay();
    const fds = wd === 0 || wd === 6;
    const k = ["", fds ? "fds" : "", wd === 0 ? "fim" : "", iso === hoje ? "hoje" : ""];
    const cDia = `<td class="d">${String(i).padStart(2, "0")}<span>${DS[wd]}</span></td>`;
    if (!d) {
      rows += `<tr class="${k.join(" ")} vazio">${cDia}<td colspan="4"></td><td class="ctrab"></td><td class="r"></td><td class="r"></td></tr>`;
      continue;
    }
    if (d.prev) k.push("prev"); if (d.a || d.div) k.push("al");
    let meio;
    if (COD[d.t]) meio = `<td colspan="4" class="cod">${COD[d.t]}</td>`;
    else if (!d.b.length) meio = `<td colspan="4"></td>`;
    else { const b = d.b.slice(0, 4); while (b.length < 4) b.push(""); meio = b.map(x => `<td>${bat(x)}</td>`).join(""); }
    rows += `<tr class="${k.join(" ")}">${cDia}${meio}<td class="ctrab">${d.w ? fmt(d.w, false) : ""}</td>
      <td class="r ${cls(d.s)}"><b>${d.s ? fmt(d.s) : (fds && !d.b.length ? "" : "00:00")}</b></td><td class="r">${fmt(d.bh)}</td></tr>`;
    const notas = [];
    if (d.a) notas.push(["al", "⚠ " + d.a + (d.b.length ? " (" + d.b.join(" ") + ")" : "")]);
    if (d.div) notas.push(["al", "≠ " + d.div + ". Vale o registro oficial."]);
    if (d.prev) notas.push(["pv", "Previsto pela sua anotação. Será substituído pelo registro da empresa."]);
    notas.forEach(([t, n]) => rows += `<tr class="nota ${t} ${k.includes("fim") ? "fim" : ""}"><td colspan="8">${esc(n)}</td></tr>`);
  }
  return `<div class="folha"><table><thead><tr><th>Dia</th><th>Ent.</th><th>Saí.</th><th>Ent.</th><th>Saí.</th>
    <th class="ctrab">Trab.</th><th style="text-align:right">Saldo</th><th style="text-align:right">Banco</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td style="text-align:left">Total</td><td colspan="4"></td><td class="ctrab">${fmt(m.trab, false)}</td>
    <td class="r ${cls(m.saldo)}">${fmt(m.saldo)}</td><td class="r">${fmt(m.banco)}</td></tr></tfoot></table></div>`;
}

/* cartão "Minha jornada" (colaborador) */
function htmlHoje(c) {
  const fator = DADOS.regras.fator || 2;
  const a = c.anot[diaHoje] || {};
  const oficial = c.oficiais.find(d => d.d === diaHoje);
  const ehHoje = diaHoje === hojeIso();
  let prev = "", mini = "";
  if (a.e) {
    const saidaPrev = toMin(a.e) + c.j.min + c.j.int;
    if (a.s) {
      const r = calcAnot(a, c.j, fator);
      prev = `<div class="prevbox"><div><small>Saldo previsto do dia</small><b>${fmt(r.saldo)}</b></div>
        <div class="cd">${fmt(r.trab, false)} trabalhadas<br><span style="opacity:.85;font-weight:500">${r.saldo > 0 ? `${fmt(r.saldo / fator, false)} a mais × ${fator}` : r.saldo === 0 ? "dentro da tolerância" : "desconta simples"}</span></div></div>`;
    } else {
      prev = `<div class="prevbox"><div><small>Saída prevista</small><b>${hhmm(saidaPrev)}</b></div>
        <div class="cd" id="cd" data-alvo="${saidaPrev}" data-ehhoje="${ehHoje ? 1 : 0}"></div></div>`;
      const ini = segunda(dParse(diaHoje)), fimS = addD(ini, 6);
      const saldoSem = c.diasTodos.filter(d => d.dt >= ini && d.dt <= fimS && d.d !== diaHoje).reduce((s, d) => s + (d.s || 0), 0);
      let zerar = "";
      if (saldoSem < 0) {
        const extra = Math.max(Math.ceil(-saldoSem / fator), c.j.tol + 1);
        zerar = `<div><small>Para zerar a semana</small><b>${hhmm(saidaPrev + extra)}</b></div>`;
      } else zerar = `<div><small>Saldo da semana</small><b class="pos">${fmt(saldoSem)}</b></div>`;
      mini = `<div class="mini"><div><small>Tolerância</small><b>${hhmm(saidaPrev - c.j.tol)}–${hhmm(saidaPrev + c.j.tol)}</b></div>
        <div><small>+1h a mais =</small><b class="pos">+${fmt(60 * fator, false)}</b></div>${zerar}</div>`;
    }
  }
  const pend = Object.keys(c.anot).filter(k => !c.oficiais.some(d => d.d === k) && k !== diaHoje).sort().reverse();
  return `<div class="card hoje"><h2>⏱ Minha jornada <small>${jorTxt(c.j)}</small></h2>
    <div class="lin" style="grid-template-columns:1fr"><div><label for="hDia">Dia</label>
      <input type="date" id="hDia" value="${diaHoje}" max="${hojeIso()}"></div></div>
    ${oficial ? `<p class="leg" style="margin:10px 0 0">✅ Este dia já tem registro oficial: ${esc(oficial.b.join(" · ") || TIPO[oficial.t] || "—")} (${fmt(oficial.s)}). Vale o oficial.</p>` : ""}
    <div class="lin" style="margin-top:10px">
      <div><label for="hE">Entrada</label><div class="campo"><input type="text" id="hE" class="hora" inputmode="numeric" autocomplete="off" placeholder="--:--" maxlength="5" value="${a.e || ""}">${ehHoje ? '<button class="agora" data-c="e">Agora</button>' : ""}</div></div>
      <div><label for="hS">Saída</label><div class="campo"><input type="text" id="hS" class="hora" inputmode="numeric" autocomplete="off" placeholder="--:--" maxlength="5" value="${a.s || ""}">${ehHoje ? '<button class="agora" data-c="s">Agora</button>' : ""}</div></div>
    </div>
    ${c.j.int ? `<p class="leg" style="margin:6px 0 0">O intervalo de ${c.j.int} min é descontado automaticamente.</p>` : ""}
    ${prev}${mini}
    ${a.e ? `<div style="text-align:right;margin-top:6px"><button class="lnk del" id="hLimpar">Apagar anotação deste dia</button></div>` : ""}
    ${pend.length ? `<div style="margin-top:8px"><label>Anotações aguardando o registro da empresa</label><ul class="lista">${pend.map(k => {
      const r = calcAnot(c.anot[k], c.j, fator);
      return `<li><span>${dBr(dParse(k), true)} · ${esc(c.anot[k].e || "")}–${esc(c.anot[k].s || "?")}</span><span><b class="${cls(r?.saldo)}">${r ? fmt(r.saldo) : "incompleto"}</b>
        <button class="lnk" data-ed="${k}">editar</button></span></li>`; }).join("")}</ul></div>` : ""}
    <p class="leg">Anotação pessoal, salva só neste aparelho. É uma previsão: quando chegar a prévia ou o cartão da empresa, vale o registro oficial.</p></div>`;
}
function ligarHoje(c) {
  const salvar = () => {
    const ok = v => HORA_OK(v) ? v : "";
    const an = lerAnot(), e = ok($("#hE").value), s = ok($("#hS").value);
    if (e || s) an[diaHoje] = {e, s}; else delete an[diaHoje];
    gravarAnot(an); preparar(c, true); iMes = mesDe(c, diaHoje); renderInd(true);
  };
  $("#hDia").onchange = e => { diaHoje = e.target.value || hojeIso(); renderInd(true); };
  // digitação com máscara: só salva quando a hora estiver completa (4 dígitos)
  document.querySelectorAll("input.hora").forEach(inp => {
    inp.addEventListener("input", () => {
      const d = inp.value.replace(/\D/g, "").slice(0, 4);
      inp.value = d.length > 2 ? d.slice(0, 2) + ":" + d.slice(2) : d;
      inp.style.borderColor = "";
      if (d.length === 4) {
        if (!HORA_OK(inp.value)) { inp.style.borderColor = "var(--neg)"; return; }
        const prox = inp.id === "hE" && !$("#hS").value;
        salvar();
        if (prox) $("#hS").focus();   // depois da entrada, vai direto para a saída
      }
    });
    inp.addEventListener("blur", () => {
      if (inp.value === "") { const an = lerAnot(); const k = inp.id === "hE" ? "e" : "s";
        if (an[diaHoje] && an[diaHoje][k]) salvar(); }
      else if (!HORA_OK(inp.value)) inp.style.borderColor = "var(--neg)";
    });
    inp.addEventListener("focus", () => inp.select());
  });
  document.querySelectorAll(".agora").forEach(b => b.onclick = () => { $(b.dataset.c === "e" ? "#hE" : "#hS").value = hhmm(agoraMin()); salvar(); });
  const l = $("#hLimpar"); if (l) l.onclick = () => { if (confirm("Apagar a anotação deste dia?")) { $("#hE").value = ""; $("#hS").value = ""; salvar(); } };
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => { diaHoje = b.dataset.ed; renderInd(true); });
  atualizarContagem();
}
function atualizarContagem() {
  const cd = $("#cd"); if (!cd) return;
  if (cd.dataset.ehhoje !== "1") { cd.textContent = ""; return; }
  const falta = +cd.dataset.alvo - agoraMin();
  cd.innerHTML = falta > 0 ? `faltam<br><span style="font-size:20px">${fmt(falta, false)}</span>` : `jornada cumprida<br><span style="font-size:20px">há ${fmt(-falta, false)}</span>`;
}

    ${c.meses.map((x, i) => ({x, i})).reverse().map(({x, i}) => { const [a, mo] = x.k.split("-"); return `<tr data-m="${i}" class="${i === iMes ? "sel" : ""}"><td>${MES[mo - 1]}/${a}</td><td class="r">${x.ndias}</td>
      <td class="r">${fmt(x.trab, false)}</td><td class="r ${cls(x.saldo)}"><b>${fmt(x.saldo)}</b></td><td class="r">${fmt(x.banco)}</td>
      <td class="r">${x.cont("folga_banco")}</td></tr>`; }).join("")}</table></div>
    <p class="leg">Saldo e banco oficiais vêm do cartão ponto da empresa. Em caso de divergência, procure a supervisão da empresa.</p></div>`;
  v.innerHTML = h;
  ligarTip(v);
  if (colab) ligarHoje(c);
  $("#ant").onclick = () => { iMes--; renderInd(true); };
  $("#prox").onclick = () => { iMes++; renderInd(true); };
  v.querySelectorAll(".resumo tr[data-m]").forEach(tr => tr.onclick = () => { iMes = +tr.dataset.m; renderInd(true); $("#cFolha").scrollIntoView({behavior: "smooth"}); });
  const sc = $("#selCol"); if (sc) sc.onchange = () => { ATUAL = DADOS.colaboradores[+sc.value]; iMes = ATUAL.meses.length - 1; renderInd(); };
  if (manterScroll) window.scrollTo(0, y);
}

/* visão equipe (só chefe) */
let ordem = "nome", busca = "", semEq = null;
function renderEquipe() {
  if (!ehChefe()) return;
  const C = DADOS.colaboradores, v = $("#vEquipe");
  const lim = (DADOS.regras && DADOS.regras.limite_banco) || 6000;
  const todas = [...new Set(C.flatMap(c => c.semanas.map(s => dIso(s.ini))))].sort();
  if (!todas.length) { v.innerHTML = "<div class='card'>Sem dados ainda.</div>"; return; }
  if (!semEq || !todas.includes(semEq)) semEq = todas[todas.length - 1];
  const ini = dParse(semEq), fimSem = addD(ini, 6);
  const linhas = C.map(c => ({ c, s: c.semanas.find(s => dIso(s.ini) === semEq) }));
  const al30 = C.flatMap(c => c.diasTodos.filter(d => d.a && (c.ultimoDia - d.dt) / 864e5 <= 30).map(d => ({c, d})));
  const somaSaldo = linhas.reduce((a, l) => a + (l.s ? l.s.saldo : 0), 0);
  const somaBanco = C.reduce((a, c) => a + (c.bancoAtual || 0), 0);
  const altos = C.filter(c => (c.bancoAtual || 0) > lim).sort((a, b) => b.bancoAtual - a.bancoAtual);
  const ultDado = new Date(Math.max(...C.map(c => c.ultimoDia || 0)));
  const mesRef = dIso(fimSem < ultDado ? fimSem : (ultDado >= ini ? ultDado : fimSem)).slice(0, 7);
  const folgas = C.map(c => ({c, ds: c.diasTodos.filter(d => d.t === "folga_banco" && d.d.slice(0, 7) === mesRef)})).filter(x => x.ds.length);
  const [ar, mr] = mesRef.split("-");
  let L = linhas.filter(l => nomeBonito(l.c.nome).toLowerCase().includes(busca.toLowerCase()) || l.c.matricula.includes(busca));
  const ord = {nome: (a, b) => a.c.nome.localeCompare(b.c.nome), banco: (a, b) => (b.c.bancoAtual || 0) - (a.c.bancoAtual || 0),
    saldo: (a, b) => (a.s?.saldo || 0) - (b.s?.saldo || 0), alerta: (a, b) => (b.s?.alertas.length || 0) - (a.s?.alertas.length || 0)};
  L.sort(ord[ordem]);
  let h = `<div class="kpis">
    <div class="kpi dest"><small>Colaboradores</small><b>${C.length}</b><span>com dados no painel</span></div>
    <div class="kpi"><small>Saldo da equipe</small><b class="${cls(somaSaldo)}">${fmt(somaSaldo)}</b><span>semana selecionada</span></div>
    <div class="kpi"><small>Banco acima de ${lim / 60}h</small><b class="${altos.length ? "neg" : "neu"}">${altos.length}</b><span>colaborador(es)</span></div>
    <div class="kpi"><small>Pontos de atenção</small><b class="${al30.length ? "neg" : "neu"}">${al30.length}</b><span>últimos 30 dias</span></div></div>`;
  h += `<div class="card ${al30.length ? "alerta-chefe" : ""}"><h2>⚠ Pontos de atenção <small>últimos 30 dias</small></h2>${al30.length ? `<ul class="lista">${al30
    .sort((a, b) => b.d.dt - a.d.dt).map(({c, d}) => `<li><span><b>${dBr(d.dt, true)}</b> · ${esc(nomeBonito(c.nome))} — ${esc(d.a)}</span><span style="color:var(--sub)">${esc(d.b.join(" "))}</span></li>`).join("")}</ul>`
    : "<p class='leg'>Nenhum alerta. 👍</p>"}</div>`;
  h += `<div class="grid2">
    <div class="card ${altos.length ? "alerta-chefe" : ""}"><h2>🔴 Banco acima de ${lim / 60}h <small>${altos.length} pessoa(s)</small></h2>
      ${altos.length ? `<ul class="lista">${altos.map(c => `<li><span>${esc(nomeBonito(c.nome))}</span><b class="neg">${fmt(c.bancoAtual)}</b></li>`).join("")}</ul>
      <p class="leg">Vale planejar folgas com banco de horas para essas pessoas.</p>` : "<p class='leg'>Ninguém acima do limite. 👍</p>"}</div>
    <div class="card"><h2>🏖 Folgas com banco de horas <small>${MES[mr - 1]}/${ar}</small></h2>
      ${folgas.length ? `<ul class="lista">${folgas.map(({c, ds}) => `<li><span>${esc(nomeBonito(c.nome))}</span><span>${ds.map(d => dBr(d.dt)).join(", ")} <b class="neg">${fmt(ds.reduce((a, d) => a + d.s, 0))}</b></span></li>`).join("")}</ul>`
        : "<p class='leg'>Nenhuma folga com banco neste mês.</p>"}</div></div>`;
  const i = todas.indexOf(semEq);
  h += `<div class="card"><div class="nav"><button id="eAnt" ${i === 0 ? "disabled" : ""}>‹</button>
    <div class="lab">Semana ${dBr(ini)} a ${dBr(fimSem, true)}<small>visão da equipe · o mês dos avisos acompanha a semana</small></div>
    <button id="eProx" ${i === todas.length - 1 ? "disabled" : ""}>›</button></div></div>`;
  h += `<div class="tools"><input id="busca" placeholder="Buscar nome ou matrícula" value="${esc(busca)}">
    <select id="ordem"><option value="nome">Ordenar: nome</option><option value="banco">Maior banco</option>
    <option value="saldo">Menor saldo na semana</option><option value="alerta">Com alertas</option></select>
    <button class="sbtn" id="csv">⬇ Exportar CSV</button></div><div class="equipe">`;
  L.forEach(({c, s}) => {
    const al = s ? s.alertas.length : 0, alto = (c.bancoAtual || 0) > lim;
    const fol = s ? s.cont("folga_banco") : 0;
    h += `<button class="mem ${alto ? "alto" : ""}" data-m="${esc(c.matricula)}"><div class="h"><div class="av">${iniciais(c.nome)}</div>
      <div style="flex:1;min-width:0"><b>${esc(nomeBonito(c.nome))}</b><span>Mat. ${esc(c.matricula)} · ${c.j.min / 60}h${al ? ` · <span class="tag w">⚠ ${al}</span>` : ""}${fol ? ` · <span class="tag">🏖 ${fol}</span>` : ""}${alto ? ` · <span class="tag w">+${lim / 60}h</span>` : ""}</span></div></div>
      <div class="n"><div><small>Saldo semana</small><b class="${cls(s?.saldo)}">${s ? fmt(s.saldo) : "—"}</b></div>
      <div><small>Horas</small><b>${s ? fmt(s.trab, false) : "—"}</b></div>
      <div><small>Banco</small><b class="${alto ? "neg" : ""}">${fmt(c.bancoAtual)}</b></div></div></button>`;
  });
  h += `</div>`;
  v.innerHTML = h;
  $("#ordem").value = ordem;
  $("#ordem").onchange = e => { ordem = e.target.value; renderEquipe(); };
  $("#busca").oninput = e => { busca = e.target.value; const p = e.target.selectionStart; renderEquipe(); const b = $("#busca"); b.focus(); b.setSelectionRange(p, p); };
  $("#eAnt").onclick = () => { semEq = todas[i - 1]; renderEquipe(); };
  $("#eProx").onclick = () => { semEq = todas[i + 1]; renderEquipe(); };
  v.querySelectorAll(".mem").forEach(b => b.onclick = () => { ATUAL = C.find(c => c.matricula === b.dataset.m); mostrar("ind"); });
  $("#csv").onclick = () => exportarCSV(linhas, ini, lim);
}
function exportarCSV(linhas, ini, lim) {
  const rows = [["Colaborador", "Matrícula", "Semana", "Dias trabalhados", "Horas trabalhadas", "Saldo semana", "Banco fim semana", "Banco atual", `Acima de ${lim / 60}h`, "Folgas banco (semana)", "Alertas"]];
  linhas.forEach(({c, s}) => rows.push([nomeBonito(c.nome), c.matricula, dBr(ini, true), s?.ndias ?? "", s ? fmt(s.trab, false) : "",
    s ? fmt(s.saldo) : "", s ? fmt(s.banco) : "", fmt(c.bancoAtual), (c.bancoAtual || 0) > lim ? "sim" : "", s ? s.cont("folga_banco") : "", s?.alertas.length ?? ""]));
  const csv = "\ufeff" + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
  a.download = `ponto_equipe_${dIso(ini)}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
</script>
